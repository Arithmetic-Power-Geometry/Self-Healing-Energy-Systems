name: SHES IEEE123 phase-aware fault probes
on:
  workflow_dispatch:
  push:
    paths:
      - "shes/run_ieee123_fault_probes.py"
      - "shes/validate_fault_probes.py"
      - "shes/test_fault_probes.py"
      - ".github/workflows/shes-ieee123-fault-probes.yml"
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and adversarial tests
        run: |
          python -m py_compile shes/run_ieee123_fault_probes.py shes/validate_fault_probes.py shes/test_fault_probes.py
          cd shes
          python -m unittest -v test_fault_probes
      - name: Install pinned simulator
        run: python -m pip install dss-python==0.15.7
      - name: Checkout pinned feeder
        run: |
          git clone --filter=blob:none --sparse https://github.com/tshort/OpenDSS.git /tmp/opendss
          cd /tmp/opendss
          git sparse-checkout set Distrib/IEEETestCases/123Bus
          git checkout 5005c668a72d20775f4c2d060feebb2866ba1d38
          test "$(git rev-parse HEAD)" = "5005c668a72d20775f4c2d060feebb2866ba1d38"
          cd Distrib/IEEETestCases/123Bus
          test -f IEEELineCodes.DSS
          cp IEEELineCodes.DSS IEEELinecodes.DSS
          cmp IEEELineCodes.DSS IEEELinecodes.DSS
      - name: Execute phase-aware fault probes
        run: |
          python -m shes.run_ieee123_fault_probes --feeder /tmp/opendss/Distrib/IEEETestCases/123Bus --output shes/ieee123_fault_probe_result.json
      - name: Independently validate results
        run: python shes/validate_fault_probes.py shes/ieee123_fault_probe_result.json
      - name: Preserve JSON and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shes-ieee123-fault-probe-evidence
          path: shes/ieee123_fault_probe_result.json
          if-no-files-found: warn
