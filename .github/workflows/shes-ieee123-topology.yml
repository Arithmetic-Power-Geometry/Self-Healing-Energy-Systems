name: SHES IEEE123 topology and terminal probes
on:
  workflow_dispatch:
  push:
    paths:
      - "shes/feeder_topology.py"
      - "shes/terminal_current_model.py"
      - "shes/run_topology_probes.py"
      - "shes/test_topology_probes.py"
      - "shes/validate_topology_result.py"
      - ".github/workflows/shes-ieee123-topology.yml"
permissions:
  contents: write
jobs:
  topology:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Adversarial unit tests
        run: |
          python -m py_compile shes/feeder_topology.py shes/terminal_current_model.py shes/run_topology_probes.py
          python -m unittest discover -s shes -p test_topology_probes.py -v
      - name: Install DSS-Python
        run: python -m pip install dss-python==0.15.7
      - name: Checkout pinned IEEE123
        run: |
          git clone --filter=blob:none --sparse https://github.com/tshort/OpenDSS.git /tmp/opendss
          cd /tmp/opendss
          git sparse-checkout set Distrib/IEEETestCases/123Bus
          git checkout 5005c668a72d20775f4c2d060feebb2866ba1d38
          test "$(git rev-parse HEAD)" = "5005c668a72d20775f4c2d060feebb2866ba1d38"
          cd Distrib/IEEETestCases/123Bus
          cp IEEELineCodes.DSS IEEELinecodes.DSS
          cmp IEEELineCodes.DSS IEEELinecodes.DSS
      - name: Execute topology and terminal probes
        run: python -m shes.run_topology_probes --feeder /tmp/opendss/Distrib/IEEETestCases/123Bus --output shes/ieee123_topology_result.json
      - name: Independently validate topology result
        run: python shes/validate_topology_result.py shes/ieee123_topology_result.json
      - name: Archive independently validated result
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shes/ieee123_topology_result.json
          if ! git diff --cached --quiet; then
            git commit -m "SHES P8: archive independently validated topology and terminal probes"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload verified scope-limited JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shes-ieee123-topology-evidence
          path: shes/ieee123_topology_result.json
          if-no-files-found: warn
