name: SHES P14 phase-aware topology audit
on:
  workflow_dispatch:
  push:
    paths:
      - "shes/phase_topology_p14.py"
      - "shes/test_phase_topology_p14.py"
      - ".github/workflows/shes-p14-phase-topology.yml"
permissions:
  contents: read
jobs:
  phase-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Adversarial conductor and topology regression
        run: python -m unittest shes.test_phase_topology_p14 -v
      - name: Install pinned dss-python
        run: |
          python -m pip install dss-python==0.15.7
          python -c "import importlib.metadata; assert importlib.metadata.version('dss-python')=='0.15.7'"
      - name: Checkout pinned upstream IEEE 123 feeder
        run: |
          git clone --filter=blob:none --sparse https://github.com/tshort/OpenDSS.git /tmp/opendss
          cd /tmp/opendss
          git sparse-checkout set Distrib/IEEETestCases/123Bus
          git checkout 5005c668a72d20775f4c2d060feebb2866ba1d38
          test "$(git rev-parse HEAD)" = "5005c668a72d20775f4c2d060feebb2866ba1d38"
          cd Distrib/IEEETestCases/123Bus
          cp IEEELineCodes.DSS IEEELinecodes.DSS
          cmp IEEELineCodes.DSS IEEELinecodes.DSS
      - name: Run fail-closed phase topology extraction
        run: python -m shes.phase_topology_p14 --feeder /tmp/opendss/Distrib/IEEETestCases/123Bus --output shes/p14_phase_topology.json | tee shes/p14_summary.json
      - name: Independent JSON evidence invariants
        run: |
          python - <<'PY'
          import json
          d=json.load(open("shes/p14_phase_topology.json"))
          assert d["upstream_commit"]=="5005c668a72d20775f4c2d060feebb2866ba1d38"
          assert d["dss_python_expected"]=="0.15.7"
          assert d["physical_protection_certificates"]==0
          assert not d["phase_energization_verified"]
          assert not d["transformer_winding_transfer_resolved"]
          assert len(d["element_records"])>=100
          for k in ("60","83"):
              assert k in d["targets"]
              assert not d["targets"][k]["installed_relay_and_ct_orientation_verified"]
          print("P14 fail-closed invariants PASS")
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: shes-p14-phase-topology-evidence
          path: |
            shes/p14_phase_topology.json
            shes/p14_summary.json
          if-no-files-found: error
