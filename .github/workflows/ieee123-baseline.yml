name: IEEE123 static baseline (Gate 3)
on:
  workflow_dispatch:
  push:
    paths:
      - "evidence/run_ieee123_baseline.py"
      - "evidence/test_ieee123_preflight.py"
      - "evidence/test_ieee123_api_contract.py"
      - "evidence/validate_ieee123_result.py"
      - "evidence/test_ieee123_result_adversarial.py"
      - "reference/master.bib"
      - "reference/audit_master.py"
      - ".github/workflows/ieee123-baseline.yml"
permissions:
  contents: write
jobs:
  feeder-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python sources before execution
        run: python -m py_compile evidence/run_ieee123_baseline.py evidence/test_ieee123_preflight.py evidence/test_ieee123_api_contract.py evidence/validate_ieee123_result.py
      - name: Audit bibliography integrity
        run: python reference/audit_master.py reference/master.bib
      - name: DSS-Python API contract regression tests
        run: python -m unittest discover -s evidence -p "test_ieee123_api_contract.py" -v
      - name: Dependency parser regression tests
        run: python -m unittest discover -s evidence -p "test_ieee123_preflight.py" -v
      - name: Adversarial output validator regression tests
        run: python -m unittest discover -s evidence -p "test_ieee123_result_adversarial.py" -v
      - name: Install pinned DSS-Python
        run: python -m pip install dss-python==0.15.7
      - name: Fetch pinned upstream feeder revision
        run: |
          git clone --filter=blob:none --sparse https://github.com/tshort/OpenDSS.git /tmp/opendss
          cd /tmp/opendss
          git sparse-checkout set Distrib/IEEETestCases/123Bus
          git checkout 5005c668a72d20775f4c2d060feebb2866ba1d38
          find Distrib/IEEETestCases/123Bus -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Repair upstream Linux filename case mismatch without changing electrical data
        run: |
          cd /tmp/opendss/Distrib/IEEETestCases/123Bus
          test -f IEEELineCodes.DSS
          test ! -f IEEELinecodes.DSS
          cp IEEELineCodes.DSS IEEELinecodes.DSS
          sha256sum IEEELineCodes.DSS IEEELinecodes.DSS
      - name: Static convergence and provenance test
        run: |
          set -o pipefail
          python evidence/run_ieee123_baseline.py --feeder /tmp/opendss/Distrib/IEEETestCases/123Bus --output evidence/ieee123_baseline_result.json 2>&1 | tee evidence/ieee123_baseline_log.txt
      - name: Independently validate simulation result JSON
        run: python evidence/validate_ieee123_result.py evidence/ieee123_baseline_result.json
      - name: Record CI execution metadata
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          printf 'run_url=https://github.com/%s/actions/runs/%s\ncommit=%s\nworkflow=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_WORKFLOW" > evidence/ieee123_ci_run_metadata.txt
      - name: Commit generated evidence to repository
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- evidence/ieee123_*
          if ! git diff --cached --quiet; then
            git commit -m "Gate 3: archive IEEE123 CI simulation evidence"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Upload log and result, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee123-gate3-diagnostics
          path: |
            evidence/ieee123_baseline_log.txt
            evidence/ieee123_baseline_result.json
          if-no-files-found: warn
