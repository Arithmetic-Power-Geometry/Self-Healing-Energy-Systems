name: SHES P15 pinned switching sensitivity
on:
  workflow_dispatch:
  push:
    paths:
      - "shes/switch_sensitivity_p15.py"
      - "shes/test_switch_sensitivity_p15.py"
      - ".github/workflows/shes-p15-switching.yml"
permissions:
  contents: read
jobs:
  switch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run adversarial tests
        run: python -m unittest shes.test_switch_sensitivity_p15 shes.test_phase_topology_p14 -v
      - name: Install pinned DSS-Python
        run: |
          python -m pip install dss-python==0.15.7
          python -c "import importlib.metadata; assert importlib.metadata.version('dss-python')=='0.15.7'"
      - name: Pin IEEE123 upstream
        run: |
          git clone --filter=blob:none --sparse https://github.com/tshort/OpenDSS.git /tmp/opendss
          cd /tmp/opendss
          git sparse-checkout set Distrib/IEEETestCases/123Bus
          git checkout 5005c668a72d20775f4c2d060feebb2866ba1d38
          test "$(git rev-parse HEAD)" = "5005c668a72d20775f4c2d060feebb2866ba1d38"
          cd Distrib/IEEETestCases/123Bus
          cp IEEELineCodes.DSS IEEELinecodes.DSS
          cmp IEEELineCodes.DSS IEEELinecodes.DSS
      - name: Run model switch sensitivity
        run: python -m shes.switch_sensitivity_p15 --feeder /tmp/opendss/Distrib/IEEETestCases/123Bus --output shes/p15_switch_evidence.json | tee shes/p15_summary.json
      - name: Independent evidence invariants
        run: |
          python - <<'PY'
          import json,math
          d=json.load(open("shes/p15_switch_evidence.json"))
          assert d["upstream_commit"]=="5005c668a72d20775f4c2d060feebb2866ba1d38"
          assert len(d["cases"])==2
          assert d["selected_switch"].lower().startswith("line.sw")
          assert d["restoration_safety_certificates"]==0
          assert not d["transformer_phase_transfer_verified"]
          assert not d["thermal_constraints_verified"]
          assert not d["signed_ct_direction_verified"]
          assert not d["operational_switching_authorized"]
          for c in d["cases"]:
              assert c["state"] in ("published","named_switch_disabled")
              for b in ("60","83"):
                  assert c["bus_voltage"][b]["finite"]
                  assert all(math.isfinite(v) for v in c["bus_voltage"][b]["voltage_pu"])
          print("P15 model evidence invariant audit PASS")
          PY
      - name: Upload audited model evidence
        uses: actions/upload-artifact@v4
        with:
          name: shes-p15-switch-model-evidence
          path: |
            shes/p15_switch_evidence.json
            shes/p15_summary.json
          if-no-files-found: error
